<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171914" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
    <meta name="description" content="CIM3 私有批准台。" />
    <title>CIM3 — Approval Desk</title>
    <link rel="stylesheet" href="./approval.css" />
    <script src="./approval.js" defer></script>
  </head>
  <body>
    <header>
      <a href="../../../"><span>O</span><strong>Outisseus</strong></a>
      <p>PRIVATE / APPROVAL DESK</p>
    </header>

    <main>
      <section class="approval-shell">
        <div class="approval-heading">
          <p>Owner-only console</p>
          <h1>把账号<br />变成 <em>approved</em></h1>
          <p class="lead">
            输入一个要授权的账号，再输入管理员口令。批准页会在线生成一个只与该账号匹配的访问口令，全程不建立账号数据库。
          </p>
        </div>

        <form id="approval-form">
          <label for="account-name">要授权的账号</label>
          <input
            id="account-name"
            name="account-name"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="例如 outisseus"
            required
          />

          <label for="owner-passphrase">管理员口令</label>
          <input
            id="owner-passphrase"
            name="owner-passphrase"
            type="password"
            autocomplete="current-password"
            spellcheck="false"
            required
          />

          <button type="submit">生成账号口令 →</button>
          <p class="status" id="approval-status" role="status" aria-live="polite">
            账号和管理员口令仅在本页浏览器中运算，不会提交到服务器。
          </p>

          <div class="result" id="approval-result" hidden>
            <div class="result-heading">
              <label for="approval-code">该账号的访问口令</label>
              <button id="copy-approval" type="button">复制</button>
            </div>
            <textarea id="approval-code" rows="7" readonly></textarea>
            <p>口令会一直有效，直到站点管理员主动轮换批准密钥。</p>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <p>© 2026 Outisseus</p>
      <p>Private signing key · Encrypted at rest</p>
    </footer>
  </body>
</html>
